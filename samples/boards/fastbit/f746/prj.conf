# Display-only build: the same LVGL/DISPLAY/sensor config proven on real
# hardware in the ota-lcd project's ci/prj_ota_lcd_f746g.conf, minus the
# OTA/WiFi/mbedTLS stack -- this sample shows the LCD work without a real
# OTA backend (see src/app/fake_backend.c for the stand-ins).

CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LV_FONT_MONTSERRAT_14=y
# See lcd_status_wiring_f746g_zephyr.c's own history: full-refresh caused
# a visible full-screen blink on every 1s UPTIME tick on this board.
CONFIG_LV_Z_FULL_REFRESH=n
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_Z_VBD_CUSTOM_SECTION=y

CONFIG_DISPLAY=y
CONFIG_DISPLAY_LOG_LEVEL_ERR=y

CONFIG_MEMC_STM32=y
CONFIG_MEMC_STM32_SDRAM=y

CONFIG_MAIN_STACK_SIZE=16384

# Touch input -- the board's stock devicetree already wires the FT5336
# capacitive touch controller (I2C3); only these two lines are needed.
CONFIG_INPUT=y
CONFIG_INPUT_FT5336=y

# DHT11 temperature+humidity sensor. Devicetree node in
# boards/stm32f746g_disco.overlay. CONFIG_DHT auto-selects itself once
# that node is enabled; only CONFIG_SENSOR is needed explicitly here.
CONFIG_SENSOR=y

CONFIG_LOG=y
